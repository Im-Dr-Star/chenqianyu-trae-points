<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
  <title>设置</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      background: #f5f7fa;
      color: #263238;
      padding: 22px 24px;
    }
    h3 { font-size: 16px; margin-bottom: 18px; }
    .field { margin-bottom: 15px; font-size: 13px; color: #455a64; }
    .field > label { display: block; margin-bottom: 6px; }
    .field input[type="number"] {
      width: 100%;
      padding: 7px 10px;
      font-size: 14px;
      border: 1px solid #cfd8dc;
      border-radius: 6px;
      outline: none;
    }
    .field input[type="number"]:focus { border-color: #1976d2; }
    .field input:disabled { background: #eceff1; color: #90a4ae; }
    .check { display: flex; align-items: center; gap: 8px; }
    .check label { margin: 0; }
    .hint { font-size: 11px; color: #90a4ae; margin-top: 4px; }
    #save {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      font-size: 14px;
      color: #ffffff;
      background: #1976d2;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #save:hover { background: #1565c0; }
  </style>
</head>
<body>
  <h3>悬浮窗设置</h3>
  <div class="field">
    <label for="interval">自动刷新间隔（秒）</label>
    <input id="interval" type="number" min="5" max="60" step="1">
    <div class="hint">最小 5 秒，避免对平台造成高频请求</div>
  </div>
  <div class="field">
    <label for="decrease">积分减少提示持续（秒）</label>
    <input id="decrease" type="number" min="1" max="60" step="1">
  </div>
  <div class="field">
    <div class="check">
      <input id="green" type="checkbox">
      <label for="green">积分增加时显示绿色提示</label>
    </div>
  </div>
  <div class="field">
    <label for="increase">积分增加提示持续（秒）</label>
    <input id="increase" type="number" min="1" max="60" step="1">
  </div>
  <div class="field">
    <label for="scale">人物大小（当前 <span id="scaleVal">0.35</span>）</label>
    <input id="scale" type="range" min="0.2" max="1.5" step="0.05">
    <div class="hint">拖动滑块即时生效，悬浮窗同步缩放</div>
  </div>
  <button id="save">保存并关闭</button>
  <script src="settings.js"></script>
</body>
</html>
